spring.application.name=campusconnect-backend

# Optional import of local git-ignored configuration for local development
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# Database Configuration (Environment variable references with no fallback secrets)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Security Configuration (Environment variable reference with no fallback secrets)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
